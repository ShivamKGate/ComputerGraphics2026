<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Forest Exploration</title>
  <style>
    body {
      margin: 0;
      overflow: hidden;
      background: #050510;
      color: white;
      font-family: Arial, sans-serif;
    }

    canvas {
      display: block;
    }

    #info {
      position: fixed;
      top: 12px;
      left: 12px;
      padding: 12px 14px;
      background: rgba(0, 0, 0, 0.6);
      border-radius: 8px;
      font-size: 14px;
      line-height: 1.4;
    }
  </style>
</head>
<body>
  <canvas id="canvas"></canvas>

  <div id="info">
    <b>Forest Exploration: Shivam Sinay Kharangate</b><br>
    Arrows or WASD are for moving the camera, and r is for resetting.<br>
    cube at origin + one scaled/translated tree instance.
  </div>

<script>

  //we add shapes (like lines) to this canvas
  const canvas = document.getElementById("canvas");
  const ctx = canvas.getContext("2d");

  //  resolution of the pixel grid
  const rows = 200;
  const cols = 320;
  const pixelGrid = Array.from({ length: cols }, () => Array(rows).fill("#050510"));

  let seePixelOutline = true;

  function setPixelColor(u,v,color){
    pixelGrid[u][v] = color;
  }

  // ---- from first-algo-student.html: cube model ----

  //an array of objects
  //    to access the first 'x' coordinate you could type vertices[0].x
  let vertices = [
    { x:  1,  y: 1,  z: 1},   // A, idx 0
    { x: -1,  y: 1,  z: 1},   // B, idx 1
    { x:  1,  y: -1, z: 1},   // C, idx 2
    { x: -1,  y: -1, z:  1},  // D, idx 3
    { x:  1,  y: 1,  z: -1},  // E, idx 4
    { x: -1,  y: 1,  z: -1},  // F, idx 5
    { x:  1,  y: -1, z:  -1}, // G, idx 6
    { x: -1,  y: -1, z: -1}   // H, idx 7
  ];

  // an array of the indics for the two vertices in each edge
  let edges = [
    [0, 1], //AB
    [0, 2], //AC
    [0, 4], //AE
    [2, 3], //CD
    [1, 3], //BD
    [2, 6], //CG
    [4, 5], //EF
    [4, 6], //EG
    [1, 5], //BF
    [6, 7], //GH
    [5, 7], //FH
    [3, 7], //DH
  ];


  // tree model in object space, centered near the origin with trunk and canopy parts
  let treeVertices = [
    { x: 0.2, y: 0, z: 0.2 },
    { x:-0.2, y: 0, z: 0.2 },
    { x: 0.2, y: 0, z:-0.2 },
    { x:-0.2, y: 0, z:-0.2 },
    { x: 0.2, y: 1, z: 0.2 },
    { x:-0.2, y: 1, z: 0.2 },
    { x: 0.2, y: 1, z:-0.2 },
    { x:-0.2, y: 1, z:-0.2 },
    { x: 0.7, y: 1, z: 0.7 },
    { x:-0.7, y: 1, z: 0.7 },
    { x: 0.7, y: 1, z:-0.7 },
    { x:-0.7, y: 1, z:-0.7 },
    { x: 0,   y: 2.2, z: 0 }
  ];

  // array of the indices for the 2 vertices in each edge
  let treeEdges = [
    [0,1],[1,3],[3,2],[2,0],
    [4,5],[5,7],[7,6],[6,4],
    [0,4],[1,5],[2,6],[3,7],
    [8,9],[9,11],[11,10],[10,8],
    [8,12],[9,12],[10,12],[11,12]
  ];

  // tree instance in world space, scaled and translated from object space
  let tree = { x: 3, y: 0, z: 0, scale: 1.5 };

  // camera position in world space
  let camera = {x: 0, y: 0, z: -10};


  function draw(){

    //here we set up and clear the canvas, every draw frame
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    ctx.fillStyle = "#050510";
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    // here we will store u,v coordinates for the vertices,
    // projected onto our 2d plane
    let projectedVertices = [];

    //- loop through the original vertices (X, Y, Z)
    //- and determine their position in 3D space relative to camera (x, y, z)
    //- then project them onto the 2D plane
    for(let v = 0; v< vertices.length; v++){   //  you could also write it foreach...
       console.log("original position:");  //helpful to print things
       console.log( vertices[v] );

       console.log("camera-relative position");
       // the vertex position is relative to the camera, so subtracting the camera position from the vertex position to get the relative position
       let camVert = {};
       camVert.x = vertices[v].x - camera.x;
       camVert.y = vertices[v].y - camera.y;
       camVert.z = vertices[v].z - camera.z;
       console.log( camVert );

       console.log("projected position");
       // this is the perspective projection, u = x/z and v = y/z formulas
       let canvasPos = {};
       canvasPos.u = camVert.x / camVert.z;
       canvasPos.v = camVert.y / camVert.z;
       console.log( canvasPos );

       console.log("scale and center");
       canvasPos.u = canvasPos.u * canvas.width + canvas.width/2;
       canvasPos.v = canvasPos.v * canvas.height + canvas.height/2;
       console.log( canvasPos );

       projectedVertices.push(canvasPos);
       console.log("---------------");

    }

    //loop through the edges
    //  find the newly computed projected vertices - 2 per edge
    //  draw the line
    for(let e = 0; e < edges.length; e++){

      //first vertex
      let e1 = edges[e][0]; //idx
      let u1 = projectedVertices[ e1 ].u;
      let v1 = canvas.height - projectedVertices[ e1 ].v;  //canvas y grows downwards, so we need to be flipping the v coordinate, similar to the PDF diagram that shows the y axis growing upwards

      //second vertex
      let e2 = edges[e][1]; //idx
      let u2 = projectedVertices[ e2 ].u;
      let v2 = canvas.height - projectedVertices[ e2 ].v;  //same explanation as above

      drawLine(u1, v1, u2, v2, "white");
    }


    // scaling and translating the tree vertices into world space, then projecting the tree vertices onto the 2D plane with the same pinhole math as the cube
    let projectedTree = [];

    for(let v = 0; v < treeVertices.length; v++){
      
      // converting the tree vertices from object space to world space
      let world = {};
      world.x = treeVertices[v].x * tree.scale + tree.x;
      world.y = treeVertices[v].y * tree.scale + tree.y;
      world.z = treeVertices[v].z * tree.scale + tree.z;

      // converting the world space coordinates to camera space coordinates
      let camVert = {};
      camVert.x = world.x - camera.x;
      camVert.y = world.y - camera.y;
      camVert.z = world.z - camera.z;

      // pinhole projection, then scaling to the canvas
      let canvasPos = {};
      canvasPos.u = camVert.x / camVert.z;
      canvasPos.v = camVert.y / camVert.z;
      canvasPos.u = canvasPos.u * canvas.width + canvas.width/2;
      canvasPos.v = canvasPos.v * canvas.height + canvas.height/2;

      projectedTree.push(canvasPos);
    }

    // green for the tree edges
    for(let e = 0; e < treeEdges.length; e++){
      let e1 = treeEdges[e][0];
      let e2 = treeEdges[e][1];
      let u1 = projectedTree[e1].u;
      let v1 = canvas.height - projectedTree[e1].v;
      let u2 = projectedTree[e2].u;
      let v2 = canvas.height - projectedTree[e2].v;
      drawLine(u1, v1, u2, v2, "#2d6a3e");
    }

  }


  //This uses a built in 'drawLine' function, provided by the javascript canvas
  function drawLine(x1, y1, x2, y2, color){
    ctx.lineWidth = 2;
    ctx.strokeStyle = color || "white";

    //this is how you draw a line on the canvas
    ctx.beginPath();
    ctx.moveTo(x1, y1);
    ctx.lineTo(x2, y2);
    ctx.stroke();
  }


  //this is how we detect events-

  // do nothing for now....
    document.addEventListener("keydown", (event) => {

      event.preventDefault();
       switch (event.key) {
        case "ArrowUp":
        case "w":
        case "W":
          camera.z -= 1; // moving the camera closer to the object
          console.log("Up arrow pressed");
          draw();
          break;
        case "ArrowDown":
        case "s":
        case "S":
          camera.z += 1; // moving the camera further away from the object
          console.log("Down arrow pressed");
          draw();
          break;
        case "ArrowLeft":
        case "a":
        case "A":
          camera.x -= 1; // moving the camera to the left
          console.log("Left arrow pressed");
          draw();
          break;
        case "ArrowRight":
        case "d":
        case "D":
          camera.x += 1; // moving the camera to the right
          console.log("Right arrow pressed");
          draw();
          break;
        case "r": // made this lowercase
          // resetting the camera to the original position
          camera.x = 0;
          camera.y = 0;
          camera.z = -10;
          console.log("Reset", camera);
          draw();
          break;
        default:
          return;

      }
    });

  function resizeCanvas() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
    draw();
  }


  window.addEventListener("resize", resizeCanvas);
  resizeCanvas();



</script>
</body>
</html>
